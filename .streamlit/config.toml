[server]
# Stesso limite usato da app.py per i PDF caricati.
maxUploadSize = 80

[client]
# Nasconde "Deploy" e i comandi per sviluppatori dalla barra in alto.
toolbarMode = "minimal"

[theme]
# Un solo accento (oro, come le dorature dei libri) su fondo inchiostro.
base = "dark"
primaryColor = "#E3A857"
backgroundColor = "#11141B"
secondaryBackgroundColor = "#1A1F29"
textColor = "#E8E6E1"
linkColor = "#E3A857"
borderColor = "#2B3240"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
headingFont = "serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
